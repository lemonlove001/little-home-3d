<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>深得倫心・3D 小家</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #f5ece8;
      color: #493c42;
      font-family: system-ui, sans-serif;
    }
    main { max-width: 1000px; margin: auto; text-align: center; }
    h1 { margin: 4px 0; }
    .hint { margin: 6px 0 16px; color: #77646b; }
    #stage {
      position: relative;
      height: min(68vw, 620px);
      min-height: 390px;
      overflow: hidden;
      border-radius: 24px;
      background: #dceaf1;
      box-shadow: 0 18px 45px #765a5630;
    }
    #stage canvas { display: block; }
    .badge {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 2;
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      background: #fff8f2e8;
      color: #a45678;
      font: 700 16px system-ui;
      cursor: pointer;
    }
    #heart {
      position: absolute;
      top: 37%;
      left: 50%;
      z-index: 3;
      opacity: 0;
      pointer-events: none;
      font-size: 60px;
      transform: translate(-50%, 0);
    }
    #heart.show { animation: float 1.4s ease-out; }
    @keyframes float {
      0% { opacity: 0; transform: translate(-50%, 20px) scale(.5); }
      25% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -95px) scale(1.4); }
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      margin: 17px 0;
    }
    .controls button {
      border: 0;
      border-radius: 999px;
      padding: 10px 15px;
      background: #765568;
      color: white;
      font: inherit;
      cursor: pointer;
    }
    .controls button:hover { background: #563b4c; }
    #message {
      min-height: 2.5em;
      padding: 13px 18px;
      border-radius: 14px;
      background: #fffaf7;
      font-weight: 600;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main>
    <h1>深得倫心・3D 小家 🏠</h1>
    <p class="hint">拖曳旋轉、滾輪縮放；點擊人物或小屋物品互動。</p>

    <div id="stage">
      <button id="couple" class="badge">深得倫心 ♡</button>
      <div id="heart">💗</div>
    </div>

    <div class="controls">
      <button id="time">切換夜晚 🌙</button>
      <button id="lampButton">關燈 💡</button>
      <button id="curtainButton">拉上窗簾</button>
      <button id="plantButton">澆植物 🪴</button>
      <button id="catButton">摸小貓 🐈</button>
      <button id="reset">重設</button>
    </div>
    <div id="message" role="status" aria-live="polite">歡迎回家！倫倫和晏深正在等你。</div>
  </main>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const stage = document.querySelector("#stage");
    const message = document.querySelector("#message");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#dceaf1");

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.set(7, 6, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    stage.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.15, 0);
    controls.enableDamping = true;
    controls.minDistance = 5;
    controls.maxDistance = 16;
    controls.maxPolarAngle = Math.PI * .48;
    controls.update();

    const mat = color => new THREE.MeshStandardMaterial({
      color, roughness: .82
    });
    const basic = color => new THREE.MeshBasicMaterial({ color });

    function add(parent, geometry, material, x, y, z) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }
    function box(parent, w, h, d, color, x, y, z) {
      return add(parent, new THREE.BoxGeometry(w, h, d),
        typeof color === "string" ? mat(color) : color, x, y, z);
    }
    function ball(parent, sx, sy, sz, color, x, y, z) {
      const mesh = add(parent, new THREE.SphereGeometry(1, 24, 16),
        typeof color === "string" ? mat(color) : color, x, y, z);
      mesh.scale.set(sx, sy, sz);
      return mesh;
    }
    function cylinder(parent, radiusTop, radiusBottom, height, color, x, y, z) {
      return add(parent,
        new THREE.CylinderGeometry(radiusTop, radiusBottom, height, 24),
        mat(color), x, y, z);
    }
    function beam(a, b, radius, color) {
      const direction = new THREE.Vector3().subVectors(b, a);
      const mesh = add(scene,
        new THREE.CylinderGeometry(radius, radius, direction.length(), 8),
        mat(color), 0, 0, 0);
      mesh.position.copy(a).add(b).multiplyScalar(.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0), direction.normalize()
      );
    }

    const ambient = new THREE.HemisphereLight("#fff6e9", "#a38c91", 1.5);
    scene.add(ambient);
    const sunlight = new THREE.DirectionalLight("#fff0d8", 2.1);
    sunlight.position.set(4, 8, 6);
    sunlight.castShadow = true;
    sunlight.shadow.mapSize.set(1024, 1024);
    scene.add(sunlight);

    // 開放式娃娃屋：地板、兩面牆、屋頂輪廓
    box(scene, 8.3, .25, 6.3, "#b77f65", 0, -.13, 0);
    const backWall = box(scene, 8.3, 3.2, .16, "#f1cfc2", 0, 1.6, -3);
    const sideWall = box(scene, .16, 3.2, 6.3, "#eed2c7", -4.08, 1.6, 0);
    for (let z = -2.7; z < 3; z += .65) {
      box(scene, 8.1, .012, .015, "#96674f", 0, .01, z);
    }
    beam(new THREE.Vector3(-4.1, 3.25, -3),
         new THREE.Vector3(0, 4.1, -3), .085, "#8f6270");
    beam(new THREE.Vector3(0, 4.1, -3),
         new THREE.Vector3(4.1, 3.25, -3), .085, "#8f6270");

    // 窗景和窗簾
    const windowSky = box(scene, 2, 1.5, .035, basic("#92cfe7"),
      1.45, 2.05, -2.88);
    const orb = ball(scene, .16, .16, .025, basic("#ffe28a"),
      1.95, 2.35, -2.82);
    const stars = [];
    for (const [x, y] of [[.9, 2.5], [1.2, 1.8], [1.7, 2.65], [2.2, 1.95]]) {
      const star = ball(scene, .035, .035, .02, basic("#ffffff"), x, y, -2.81);
      star.visible = false;
      stars.push(star);
    }
    box(scene, 2.1, .09, .1, "#fff8ee", 1.45, 2.82, -2.79);
    box(scene, 2.1, .09, .1, "#fff8ee", 1.45, 1.28, -2.79);
    box(scene, .09, 1.55, .1, "#fff8ee", .40, 2.05, -2.79);
    box(scene, .09, 1.55, .1, "#fff8ee", 2.50, 2.05, -2.79);
    box(scene, .06, 1.5, .1, "#fff8ee", 1.45, 2.05, -2.76);
    const curtainLeft = box(scene, .49, 1.52, .06, "#c97989",
      .66, 2.05, -2.70);
    const curtainRight = box(scene, .49, 1.52, .06, "#c97989",
      2.24, 2.05, -2.70);

    // 沙發、地毯、茶几
    box(scene, 2.45, .65, .68, "#ce8890", -1.55, .91, -1.92);
    box(scene, 2.55, .52, 1.05, "#e8a5a1", -1.55, .47, -1.45);
    box(scene, .25, .64, 1.08, "#cc838c", -2.79, .58, -1.45);
    box(scene, .25, .64, 1.08, "#cc838c", -.31, .58, -1.45);
    cylinder(scene, 1.65, 1.65, .025, "#e8c2b8", .25, .035, .85);
    cylinder(scene, .55, .55, .08, "#bb886e", -2.35, .62, .65);
    cylinder(scene, .08, .08, .56, "#8b6157", -2.35, .32, .65);

    // 立燈
    const lampGroup = new THREE.Group();
    lampGroup.position.set(3.15, 0, -1.55);
    lampGroup.userData.action = "lamp";
    scene.add(lampGroup);
    cylinder(lampGroup, .25, .25, .08, "#775e62", 0, .05, 0);
    cylinder(lampGroup, .035, .035, 1.65, "#776468", 0, .9, 0);
    const shade = cylinder(lampGroup, .2, .42, .52, "#f9d99b",
      0, 1.86, 0);
    const lampLight = new THREE.PointLight("#ffd69a", 2.5, 5);
    lampLight.position.set(0, 1.75, 0);
    lampGroup.add(lampLight);

    // 植物
    const plant = new THREE.Group();
    plant.position.set(-3.15, 0, .75);
    plant.userData.action = "plant";
    scene.add(plant);
    cylinder(plant, .24, .18, .35, "#b77762", 0, .19, 0);
    cylinder(plant, .025, .025, .54, "#638b5a", 0, .58, 0);
    const leaves = new THREE.Group();
    plant.add(leaves);
    for (const [x, y, z] of [
      [-.17, .65, 0], [.16, .72, 0], [0, .9, -.08],
      [-.1, .84, .12], [.11, .55, .15]
    ]) {
      ball(leaves, .19, .11, .12, "#6e9c69", x, y, z);
    }
    const flower = ball(plant, .12, .12, .12, "#eaa6bd", 0, 1.02, 0);
    flower.visible = false;

    // 小貓
    const cat = new THREE.Group();
    cat.position.set(2.8, 0, 1.65);
    cat.userData.action = "cat";
    scene.add(cat);
    ball(cat, .37, .3, .47, "#e5b78d", 0, .33, 0);
    ball(cat, .3, .29, .27, "#e9bd96", 0, .68, .26);
    for (const x of [-.19, .19]) {
      const ear = add(cat, new THREE.ConeGeometry(.14, .25, 4),
        mat("#c99478"), x, .98, .26);
      ear.rotation.y = Math.PI / 4;
      ball(cat, .035, .045, .025, "#493b38", x * .65, .73, .52);
    }
    ball(cat, .045, .035, .025, "#b8797b", 0, .6, .53);

    // 人物頭上的姓名牌
    function nameTag(parent, text) {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 80;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff8f0";
      ctx.fillRect(12, 10, 232, 58);
      ctx.fillStyle = "#684c5e";
      ctx.font = "bold 38px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 128, 40);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: new THREE.CanvasTexture(canvas),
        depthTest: false
      }));
      sprite.position.set(0, 2.18, 0);
      sprite.scale.set(1.05, .33, 1);
      parent.add(sprite);
    }

    function makePerson({ name, x, hair, highlight, eyes, clothes,
                          trousers, longHair, mole }) {
      const person = new THREE.Group();
      person.position.set(x, 0, .72);
      person.userData.action = name;
      scene.add(person);

      // Q 版比例：大頭、短手腳
      ball(person, .21, .34, .23, trousers, -.2, .31, 0);
      ball(person, .21, .34, .23, trousers, .2, .31, 0);
      ball(person, .25, .1, .31, "#5d4a4c", -.2, .06, .13);
      ball(person, .25, .1, .31, "#5d4a4c", .2, .06, .13);
      ball(person, .39, .38, .28, clothes, 0, .82, 0);
      ball(person, .15, .32, .15, clothes, -.42, .83, 0);
      ball(person, .15, .32, .15, clothes, .42, .83, 0);
      ball(person, .13, .13, .13, "#f1c7ae", -.43, .56, .03);
      ball(person, .13, .13, .13, "#f1c7ae", .43, .56, .03);

      // 後髮、臉、自然碎瀏海
      ball(person, .51, longHair ? .67 : .47, .44,
        hair, 0, longHair ? 1.33 : 1.52, -.13);
      if (longHair) {
        for (const side of [-1, 1]) {
          ball(person, .19, .49, .2, highlight,
            side * .42, 1.1, -.05);
          ball(person, .16, .24, .17, hair,
            side * .43, .72, -.04);
        }
      }
      ball(person, .43, .45, .4, "#f3ceb7", 0, 1.48, .05);
      ball(person, .43, .28, .38, hair, 0, 1.83, -.05);
      const fringe1 = ball(person, .29, .12, .19, highlight,
        -.15, 1.79, .31);
      fringe1.rotation.z = -.3;
      const fringe2 = ball(person, .2, .1, .15, hair,
        .25, 1.86, .28);
      fringe2.rotation.z = .4;

      // 眼睛、眼下小痣與微笑
      for (const side of [-1, 1]) {
        ball(person, .075, .085, .035, eyes,
          side * .16, 1.52, .414);
        ball(person, .022, .025, .012, "#fff5d8",
          side * .16 - .016, 1.55, .448);
      }
      if (mole) {
        ball(person, .018, .018, .012, "#614943",
          -.235, 1.39, .42);
      }
      const smile = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-.09, 1.32, .42),
        new THREE.Vector3(0, 1.29, .446),
        new THREE.Vector3(.10, name === "晏深" ? 1.35 : 1.32, .42)
      ]);
      add(person, new THREE.TubeGeometry(smile, 12, .009, 5, false),
        mat("#a76565"), 0, 0, 0);

      nameTag(person, name === "薛倫" ? "倫倫" : "晏深");
      return person;
    }

    const lunlun = makePerson({
      name: "薛倫", x: -.72,
      hair: "#b88496", highlight: "#d8a3b0",
      eyes: "#8a654a", clothes: "#f4d6dc",
      trousers: "#c78e9e", longHair: true, mole: true
    });
    const yanshen = makePerson({
      name: "晏深", x: .86,
      hair: "#30211e", highlight: "#684531",
      eyes: "#88592b", clothes: "#414b5c",
      trousers: "#353b49", longHair: false, mole: false
    });

    let night = false;
    let lampOn = true;
    let curtainsOpen = true;
    let waterCount = 0;
    let petUntil = 0;
    const speech = { "薛倫": 0, "晏深": 0 };
    const lines = {
      "薛倫": [
        "倫倫：歡迎回家！今天要一起佈置哪個角落？",
        "倫倫：你看，晏深又在偷偷笑我。"
      ],
      "晏深": [
        "晏深：倫倫喜歡這裡，我就喜歡。",
        "晏深：被你發現了？我是在看她。"
      ]
    };

    function say(text) { message.textContent = text; }
    function updateLight() {
      scene.background.set(night ? "#111a31" : "#dceaf1");
      ambient.intensity = night ? .48 : 1.5;
      sunlight.intensity = night ? .28 : 2.1;
      lampLight.intensity = lampOn ? (night ? 4 : 2.5) : 0;
      shade.material.color.set(lampOn ? "#f9d99b" : "#a49689");
      windowSky.material.color.set(night ? "#213556" : "#92cfe7");
      orb.material.color.set(night ? "#f2f1e1" : "#ffe28a");
      stars.forEach(star => star.visible = night);
      backWall.material.color.set(night ? "#a498ab" : "#f1cfc2");
      sideWall.material.color.set(night ? "#9990a5" : "#eed2c7");
      document.querySelector("#time").textContent =
        night ? "切換白天 ☀️" : "切換夜晚 🌙";
      document.querySelector("#lampButton").textContent =
        lampOn ? "關燈 💡" : "開燈 💡";
    }
    function toggleNight() {
      night = !night;
      updateLight();
      say(night ? "夜晚到了，小屋亮起暖暖的燈。" : "早安！陽光照進小家了。");
    }
    function toggleLamp() {
      lampOn = !lampOn;
      updateLight();
      say(lampOn ? "晏深把燈打開了。" : "燈關好了，晚安。");
    }
    function toggleCurtains() {
      curtainsOpen = !curtainsOpen;
      document.querySelector("#curtainButton").textContent =
        curtainsOpen ? "拉上窗簾" : "拉開窗簾";
      say(curtainsOpen ? "窗簾拉開了。" : "窗簾拉好了。");
    }
    function waterPlant() {
      waterCount = Math.min(waterCount + 1, 3);
      leaves.scale.setScalar(1 + waterCount * .12);
      flower.visible = waterCount >= 3;
      say(flower.visible ? "倫倫：花開了！好漂亮。" : "植物喝到水，長高了一點。");
    }
    function petCat() {
      petUntil = performance.now() + 700;
      say("小貓：喵～");
    }
    function talk(name) {
      say(lines[name][speech[name]]);
      speech[name] = (speech[name] + 1) % lines[name].length;
    }
    function coupleMoment() {
      say("深得倫心 ♡｜倫倫一回頭，就撞見晏深溫柔又帶點壞笑的目光。");
      const heart = document.querySelector("#heart");
      heart.classList.remove("show");
      void heart.offsetWidth;
      heart.classList.add("show");
    }

    document.querySelector("#time").onclick = toggleNight;
    document.querySelector("#lampButton").onclick = toggleLamp;
    document.querySelector("#curtainButton").onclick = toggleCurtains;
    document.querySelector("#plantButton").onclick = waterPlant;
    document.querySelector("#catButton").onclick = petCat;
    document.querySelector("#couple").onclick = coupleMoment;
    document.querySelector("#reset").onclick = () => {
      night = false;
      lampOn = true;
      curtainsOpen = true;
      waterCount = 0;
      leaves.scale.setScalar(1);
      flower.visible = false;
      document.querySelector("#curtainButton").textContent = "拉上窗簾";
      updateLight();
      say("小家回到最初的樣子了！");
    };

    // 點選 3D 人物和物品
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const targets = [lunlun, yanshen, lampGroup, plant, cat];
    let pointerStart = null;

    renderer.domElement.addEventListener("pointerdown", event => {
      pointerStart = [event.clientX, event.clientY];
    });
    renderer.domElement.addEventListener("pointerup", event => {
      if (!pointerStart ||
          Math.hypot(event.clientX - pointerStart[0],
                     event.clientY - pointerStart[1]) > 6) return;
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObjects(targets, true)[0];
      if (!hit) return;
      let object = hit.object;
      while (object && !object.userData.action) object = object.parent;
      switch (object?.userData.action) {
        case "薛倫": talk("薛倫"); break;
        case "晏深": talk("晏深"); break;
        case "lamp": toggleLamp(); break;
        case "plant": waterPlant(); break;
        case "cat": petCat(); break;
      }
    });

    function resize() {
      const width = stage.clientWidth;
      const height = stage.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }
    new ResizeObserver(resize).observe(stage);
    resize();
    updateLight();

    renderer.setAnimationLoop(() => {
      const t = performance.now();
      lunlun.position.y = Math.sin(t * .002) * .025;
      yanshen.position.y = Math.sin(t * .002 + 1) * .025;
      cat.rotation.z = t < petUntil ? Math.sin(t * .04) * .12 : 0;
      curtainLeft.position.x +=
        ((curtainsOpen ? .66 : 1.18) - curtainLeft.position.x) * .12;
      curtainRight.position.x +=
        ((curtainsOpen ? 2.24 : 1.72) - curtainRight.position.x) * .12;
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
